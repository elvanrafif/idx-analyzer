<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDX Analyzer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="logo-mark">📊</div>
      <div class="header-text">
        <h1>IDX <span>ANALYZER</span></h1>
        <p>FINANCIAL &amp; FUNDAMENTAL ANALYSIS — INDONESIA STOCK EXCHANGE</p>
      </div>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:.3px;">by <span style="color:var(--accent)">ElvanRafif</span></div>
  </div>

  <div class="search-wrap">
    <span class="search-prefix">IDX:</span>
    <input type="text" id="ticker-input" placeholder="Enter ticker... e.g. BBCA" maxlength="10" autocomplete="off" spellcheck="false">
    <button id="search-btn" onclick="analyze()">ANALYZE →</button>
  </div>

  <div id="error-box"></div>
  <div id="loading"><div class="spinner"></div><p>Fetching market data...</p></div>
  <div id="result"></div>

  <div class="footer">
    IDX ANALYZER · ~15 MIN DELAY<br>
    FOR REFERENCE ONLY — NOT INVESTMENT ADVICE
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
